<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Transaction Status Demo</title>
</head>
<body>
  <div style="max-width:720px;margin:2rem auto;">
    <h1>Donation Transaction Status</h1>
    <p>Enter transaction ID to fetch status from the API.</p>
    <input id="tx" placeholder="transaction id" style="width:100%;padding:8px;" />
    <button id="btn" style="margin-top:8px;">Check Status</button>
    <pre id="out" style="background:#111;color:#0f0;padding:12px;margin-top:12px;min-height:160px;white-space:pre-wrap;"></pre>
  </div>
  <script>
    document.getElementById('btn').addEventListener('click', async ()=>{
      const id = document.getElementById('tx').value.trim();
      if (!id) return;
      const res = await fetch(`/donation-api.php?action=status&id=${encodeURIComponent(id)}`);
      const json = await res.json();
      document.getElementById('out').textContent = JSON.stringify(json,null,2);
    });
  </script>
</body>
</html>
